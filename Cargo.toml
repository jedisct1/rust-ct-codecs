[package]
name = "ct-codecs"
version = "1.1.8"
authors = ["Frank Denis <github@pureftpd.org>"]
edition = "2018"
description = "Constant-time Base64, Base32, and hex encoding and decoding, with URL-safe Base64 and no_std support."
keywords = ["base64", "base32", "hex", "constant-time", "no-std"]
license = "MIT"
homepage = "https://github.com/jedisct1/rust-ct-codecs"
repository = "https://github.com/jedisct1/rust-ct-codecs"
categories = ["no-std", "cryptography", "encoding"]
readme = "README.md"
include = ["src/**/*.rs", "README.md", "LICENSE"]

[profile.release]
codegen-units = 1
incremental = false
panic = "abort"

[features]
default = ["std"]
std = []
